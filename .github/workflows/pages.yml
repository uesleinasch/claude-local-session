name: pages

on:
  push:
    branches: [Production]
    paths:
      - site/**
      - web/fonts/**
      - desktop/icon.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # A página reaproveita a fonte e o ícone do app em vez de manter cópias que envelhecem.
      - name: montar o site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp web/fonts/inter-latin-opsz-normal.woff2 _site/
          cp desktop/icon.svg _site/icon.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
